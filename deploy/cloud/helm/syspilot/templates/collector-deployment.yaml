apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syspilot.name" . }}-collector
  labels:
    {{- include "syspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  replicas: {{ .Values.collector.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "syspilot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        {{- include "syspilot.labels" . | nindent 8 }}
        app.kubernetes.io/component: collector
    spec:
      serviceAccountName: {{ include "syspilot.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: {{ include "syspilot.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: collector-database-url
            - name: SYSPILOT_CREDENTIAL_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: credential-pepper
            - name: DATABASE_CONNECTIONS
              value: {{ .Values.collector.databaseConnections | quote }}
            - name: CONCURRENT_REQUESTS
              value: {{ .Values.collector.concurrentRequests | quote }}
            - name: LISTEN_ADDR
              value: 0.0.0.0:8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
