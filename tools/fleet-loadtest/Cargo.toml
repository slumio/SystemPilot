[package]
name = "syspilot-fleet-loadtest"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
axum = { version = "=0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
