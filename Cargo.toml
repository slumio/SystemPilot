[package]
name = "syspilot"
version = "0.1.0"
edition = "2021"
authors = ["SysPilot Contributors"]
description = "Linux process diagnostics and operating-system reasoning CLI"
readme = "README.md"
license = "MIT"
repository = "https://github.com/slumio/SystemPilot"
homepage = "https://github.com/slumio/SystemPilot"
keywords = ["linux", "diagnostics", "observability", "telemetry", "cli"]
categories = ["command-line-utilities", "development-tools::debugging", "os::linux-apis"]
include = [
    "/src/**",
    "/tests/**",
    "/crates/syspilot-abi/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/README.md",
    "/install.sh",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/deploy/syspilot.service",
]

[workspace]
members = [".", "crates/syspilot-abi", "crates/syspilot-collector", "crates/syspilot-cloud", "tools/fleet-loadtest"]
resolver = "2"

[[bin]]
name = "syspilot"
path = "src/main.rs"

[lib]
name = "syspilot"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.10.1"

[dependencies]
syspilot-abi = { version = "0.1.0", path = "crates/syspilot-abi", features = ["serde"] }

# CLI argument parsing
clap = { version = "4.5.4", features = ["derive"] }
rpassword = "7.3.1"

# Serialization / Deserialization
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"

# Async runtime + HTTP
tokio = { version = "1.36.0", features = ["full"] }
reqwest = { version = "0.12.3", default-features = false, features = ["json", "stream", "blocking", "rustls-tls"] }
futures-util = "0.3.30"

# Tracing / logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }

# Home directory lookup
dirs = "5.0.1"

# Bytes
bytes = "1.6.0"

# Crossbeam for lock-free MPMC channel (replaces moodycamel ConcurrentQueue)
crossbeam-channel = "0.5.12"

# DashMap for concurrent hash map (replaces Intel TBB concurrent_hash_map)
dashmap = "5.5.3"

# Mimalloc global allocator (drop-in replacement)
mimalloc = { version = "0.1.39", default-features = false }

# Unix-specific syscalls (Netlink, signals, termios, etc.)
nix = { version = "0.28.0", features = ["process", "signal", "term", "socket", "net", "ioctl", "fs", "user"] }

# Libc for low-level POSIX / Linux constants
libc = "0.2.153"
crossterm = "=0.29.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
incremental = false
