[package]
name = "syspilot"
version = "0.1.0"
edition = "2021"
authors = ["SysPilot Contributors"]
description = "High-performance Operating System Reasoning Agent"

[workspace]
members = [".", "crates/syspilot-abi", "crates/syspilot-collector"]
resolver = "2"

[[bin]]
name = "syspilot"
path = "src/main.rs"

[lib]
name = "syspilot"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.10.1"

[dependencies]
syspilot-abi = { path = "crates/syspilot-abi", features = ["serde"] }

# CLI argument parsing
clap = { version = "4.5.4", features = ["derive"] }

# Serialization / Deserialization
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"

# Async runtime + HTTP
tokio = { version = "1.36.0", features = ["full"] }
reqwest = { version = "0.12.3", features = ["json", "stream", "blocking"] }
futures-util = "0.3.30"

# Tracing / logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }

# Home directory lookup
dirs = "5.0.1"

# Bytes
bytes = "1.6.0"

# Crossbeam for lock-free MPMC channel (replaces moodycamel ConcurrentQueue)
crossbeam-channel = "0.5.12"

# DashMap for concurrent hash map (replaces Intel TBB concurrent_hash_map)
dashmap = "5.5.3"

# Mimalloc global allocator (drop-in replacement)
mimalloc = { version = "0.1.39", default-features = false }

# Unix-specific syscalls (Netlink, signals, termios, etc.)
nix = { version = "0.28.0", features = ["process", "signal", "term", "socket", "net", "ioctl", "fs", "user"] }

# Libc for low-level POSIX / Linux constants
libc = "0.2.153"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
