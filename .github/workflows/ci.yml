name: SysPilot CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential g++ \
          libmimalloc-dev libsimdjson-dev libspdlog-dev libfmt-dev \
          libtbb-dev libcurl4-openssl-dev

    - name: Compile SysPilot
      run: |
        chmod +x ./build.sh
        ./build.sh

    - name: Run Static Hardening Checks
      run: |
        bash tests/static_hardening_checks.sh

    - name: Verify Build Output
      run: |
        if [ ! -f ./syspilot ]; then
          echo "Error: syspilot binary not found!"
          exit 1
        fi
        echo "✓ SysPilot successfully compiled."
