name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

permissions:
  contents: read

jobs:
  fleet-transport-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VIRTUAL_SERVERS: "1000"
      DURATION_SECONDS: "30"
      BATCH_SIZE: "16"
      REQUESTS_PER_SERVER_SECOND: "1"
      MAX_FAILURE_RATE: "0.001"
      MAX_P95_MS: "500"
    steps:
      - uses: actions/checkout@v4
      - name: Validate benchmark Compose model
        run: docker compose -f compose.fleet-benchmark.yml config --quiet
      - name: Build pinned benchmark containers
        run: docker compose -f compose.fleet-benchmark.yml build
      - name: Run 1,000-server transport gate
        run: docker compose -f compose.fleet-benchmark.yml up --abort-on-container-exit --exit-code-from load
      - name: Preserve benchmark report
        if: always()
        run: docker compose -f compose.fleet-benchmark.yml logs --no-color --no-log-prefix load > fleet-benchmark.json
      - name: Remove benchmark containers
        if: always()
        run: docker compose -f compose.fleet-benchmark.yml down --volumes --remove-orphans
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-transport-benchmark-${{ github.sha }}
          path: fleet-benchmark.json
          if-no-files-found: error

  fleet-peak-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LOAD_MODE: saturation
      VIRTUAL_SERVERS: "16"
      DURATION_SECONDS: "30"
      BATCH_SIZE: "1024"
      MIN_ENVELOPES_PER_SECOND: "750000"
      MAX_FAILURE_RATE: "0.001"
      MAX_P95_MS: "100"
    steps:
      - uses: actions/checkout@v4
      - name: Validate peak benchmark Compose model
        run: docker compose -f compose.fleet-benchmark.yml config --quiet
      - name: Build pinned benchmark containers
        run: docker compose -f compose.fleet-benchmark.yml build
      - name: Run saturated peak-throughput gate
        run: docker compose -f compose.fleet-benchmark.yml up --abort-on-container-exit --exit-code-from load
      - name: Preserve peak benchmark report
        if: always()
        run: docker compose -f compose.fleet-benchmark.yml logs --no-color --no-log-prefix load > fleet-peak-benchmark.json
      - name: Remove peak benchmark containers
        if: always()
        run: docker compose -f compose.fleet-benchmark.yml down --volumes --remove-orphans
      - name: Upload peak benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-peak-benchmark-${{ github.sha }}
          path: fleet-peak-benchmark.json
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: syspilot-${{ matrix.runner }}
          path: target/release/syspilot
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Dependency vulnerability audit
        run: cargo audit --deny warnings
      - name: License and dependency policy
        run: cargo deny check
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [debian:12, ubuntu:24.04, fedora:42]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain prerequisites
        run: |
          if command -v apt-get; then apt-get update && apt-get install -y curl build-essential pkg-config; fi
          if command -v dnf; then dnf install -y curl gcc gcc-c++ make pkgconf-pkg-config; fi
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
      - name: Restricted-procfs compatible build and tests
        env:
          CARGO_BUILD_JOBS: "2"
        run: . "$HOME/.cargo/env" && cargo test --locked --workspace -- --test-threads=1

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - name: Build release binary
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Install pinned nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
      - name: Build Debian and RPM packages
        env:
          SYSPILOT_PACKAGE_ARCH: amd64
          SYSPILOT_PACKAGE_BINARY: target/x86_64-unknown-linux-musl/release/syspilot
          SYSPILOT_PACKAGE_VERSION: 0.1.0
        run: |
          mkdir -p dist
          deploy/packages/build.sh deb dist/syspilot.deb
          SYSPILOT_PACKAGE_ARCH=x86_64 deploy/packages/build.sh rpm dist/syspilot.rpm
      - name: Smoke-test Debian install and upgrade
        run: docker run --rm -v "$PWD:/workspace:ro" debian:12 /workspace/deploy/packages/smoke-test.sh /workspace/dist/syspilot.deb
      - name: Smoke-test RPM install and upgrade
        run: docker run --rm -v "$PWD:/workspace:ro" fedora:42 /workspace/deploy/packages/smoke-test.sh /workspace/dist/syspilot.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: syspilot-linux-packages-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  cloud-deployment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.2
      - name: Validate cloud development Compose model
        run: |
          export SYSPILOT_DEV_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export SYSPILOT_DEV_RUNTIME_PASSWORD="$(openssl rand -hex 24)"
          export SYSPILOT_DEV_PEPPER="$(openssl rand -hex 32)"
          export SYSPILOT_DEV_TOKEN="spn_local.$(openssl rand -hex 24)"
          docker compose -f compose.cloud-dev.yml config --quiet
      - name: Build hardened cloud image
        run: docker build --file Dockerfile.cloud --tag syspilot-cloud:ci .
      - name: Lint and render hardened AWS chart
        run: |
          helm lint deploy/cloud/helm/syspilot --set reasoning.endpoint=https://reasoning.example.test/v1/analyze --set notification.endpoint=https://notification.example.test/v1/deliver
          helm template syspilot deploy/cloud/helm/syspilot --set reasoning.endpoint=https://reasoning.example.test/v1/analyze --set notification.endpoint=https://notification.example.test/v1/deliver > /tmp/syspilot-cloud-manifests.yaml

  fleet-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: migration-test
          POSTGRES_DB: syspilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d syspilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client jq
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and reapply fleet schema
        env:
          FLEET_DB_ALLOW_INSECURE: "1"
          FLEET_DATABASE_URL: postgresql://postgres:migration-test@localhost:5432/syspilot?sslmode=disable
        run: |
          deploy/fleet/setup-db.sh
          deploy/fleet/setup-db.sh
      - name: Prove tenant isolation and immutable audit history
        env:
          PGPASSWORD: migration-test
        run: |
          psql -h localhost -U postgres -d syspilot --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE syspilot_runtime LOGIN PASSWORD 'runtime-test';
          GRANT syspilot_control_app TO syspilot_runtime;
          INSERT INTO syspilot_control.tenants(tenant_id, name) VALUES
            ('00000000-0000-0000-0000-000000000001', 'tenant-one'),
            ('00000000-0000-0000-0000-000000000002', 'tenant-two');
          SQL
          PGPASSWORD=runtime-test psql -h localhost -U syspilot_runtime -d syspilot --set ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL syspilot.tenant_id = '00000000-0000-0000-0000-000000000001';
          INSERT INTO syspilot_control.nodes(tenant_id,node_id,agent_version,protocol_version)
          VALUES ('00000000-0000-0000-0000-000000000001','node-one','test',1);
          INSERT INTO syspilot_control.audit_events(tenant_id,action,target_type)
          VALUES ('00000000-0000-0000-0000-000000000001','test.create','node');
          COMMIT;
          SQL
          visible=$(PGPASSWORD=runtime-test psql -h localhost -U syspilot_runtime -d syspilot --tuples-only --no-align --set ON_ERROR_STOP=1 \
            --command "BEGIN; SET LOCAL syspilot.tenant_id = '00000000-0000-0000-0000-000000000002'; SELECT count(*) FROM syspilot_control.nodes; COMMIT;" | sed -n '3p')
          test "$visible" = "0"
          if PGPASSWORD=runtime-test psql -h localhost -U syspilot_runtime -d syspilot --set ON_ERROR_STOP=1 \
            --command "BEGIN; SET LOCAL syspilot.tenant_id = '00000000-0000-0000-0000-000000000001'; UPDATE syspilot_control.audit_events SET action = 'tampered'; COMMIT;"; then
            echo "audit mutation unexpectedly succeeded" >&2
            exit 1
          fi
          if PGPASSWORD=runtime-test psql -h localhost -U syspilot_runtime -d syspilot --set ON_ERROR_STOP=1 \
            --command "SELECT * FROM syspilot_control.tenants"; then
            echo "runtime role unexpectedly read global tenants" >&2
            exit 1
          fi
      - name: Exercise authenticated transactional ingestion
        env:
          PGPASSWORD: migration-test
        run: |
          TEST_TOKEN="spn_test.$(openssl rand -hex 24)"
          TEST_PEPPER=$(openssl rand -hex 32)
          token_hash=$(printf '%s' "$TEST_TOKEN" | openssl dgst -sha256 -hmac "$TEST_PEPPER" -binary | xxd -p -c 256)
          psql -h localhost -U postgres -d syspilot --set ON_ERROR_STOP=1 <<SQL
          INSERT INTO syspilot_control.enrollment_credentials
            (tenant_id,node_id,token_prefix,token_hash,expires_at)
          VALUES
            ('00000000-0000-0000-0000-000000000001','node-one','spn_test',decode('$token_hash','hex'),clock_timestamp() + interval '1 day');
          INSERT INTO syspilot_control.alert_destinations(tenant_id,channel,destination_ref)
          VALUES ('00000000-0000-0000-0000-000000000001','email','ops@example.test');
          CREATE ROLE syspilot_reasoner LOGIN PASSWORD 'reasoner-test';
          GRANT syspilot_cloud_worker TO syspilot_reasoner;
          CREATE ROLE syspilot_notifier LOGIN PASSWORD 'notifier-test';
          GRANT syspilot_notification_worker TO syspilot_notifier;
          SQL
          cargo build --locked -p syspilot-cloud
          DATABASE_URL='postgresql://syspilot_runtime:runtime-test@localhost:5432/syspilot?sslmode=disable' \
          SYSPILOT_CREDENTIAL_PEPPER="$TEST_PEPPER" LISTEN_ADDR=127.0.0.1:18080 \
            target/debug/syspilot-cloud >cloud-collector.log 2>&1 &
          collector_pid=$!
          trap 'kill "$collector_pid" 2>/dev/null || true; cat cloud-collector.log' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/health/ready && break
            sleep 1
          done
          payload='[{"schema_version":1,"message_id":"message-one","node_id":"node-one","sequence":1,"observed_at_unix_nanos":1725000000123456789,"kind":"health","payload":{"healthy":true},"attributes":{}}]'
          first=$(curl --fail --silent -H "Authorization: Bearer $TEST_TOKEN" -H 'Content-Type: application/json' --data "$payload" http://127.0.0.1:18080/v1/telemetry)
          test "$(printf '%s' "$first" | jq -r '.accepted_message_ids[0]')" = message-one
          replay=$(curl --fail --silent -H "Authorization: Bearer $TEST_TOKEN" -H 'Content-Type: application/json' --data "$payload" http://127.0.0.1:18080/v1/telemetry)
          test "$(printf '%s' "$replay" | jq -r '.accepted_message_ids[0]')" = message-one
          replay_conflict_payload='[{"schema_version":1,"message_id":"message-one","node_id":"node-one","sequence":1,"observed_at_unix_nanos":1725000000123456789,"kind":"health","payload":{"healthy":false},"attributes":{}}]'
          replay_conflict=$(curl --fail --silent -H "Authorization: Bearer $TEST_TOKEN" -H 'Content-Type: application/json' --data "$replay_conflict_payload" http://127.0.0.1:18080/v1/telemetry)
          test "$(printf '%s' "$replay_conflict" | jq -r '.rejected_records[0].reason')" = message_id_content_conflict
          conflict_payload='[{"schema_version":1,"message_id":"message-conflict","node_id":"node-one","sequence":1,"observed_at_unix_nanos":1725000000123456790,"kind":"health","payload":{"healthy":true},"attributes":{}}]'
          conflict=$(curl --fail --silent -H "Authorization: Bearer $TEST_TOKEN" -H 'Content-Type: application/json' --data "$conflict_payload" http://127.0.0.1:18080/v1/telemetry)
          test "$(printf '%s' "$conflict" | jq -r '.rejected_records[0].reason')" = sequence_conflict
          test "$(psql -h localhost -U postgres -d syspilot -tAc 'SELECT count(*) FROM syspilot_control.telemetry_messages')" = 1
          test "$(psql -h localhost -U postgres -d syspilot -tAc 'SELECT count(*) FROM syspilot_control.reasoning_jobs')" = 0
          test "$(psql -h localhost -U postgres -d syspilot -tAc 'SELECT count(*) FROM syspilot_control.active_server_days')" = 1
          alert_payload='[{"schema_version":1,"message_id":"alert-one","node_id":"node-one","sequence":2,"observed_at_unix_nanos":1725000000123456791,"kind":"process_alert","payload":{"instance_id":"alert-instance","state":"firing","previous_state":null,"rule_id":"postgres-exit","process_name":"postgres","pid":12,"ppid":1,"event_type":"EXIT","observed_at_unix_nanos":1725000000123456791,"labels":{"severity":"high"}},"attributes":{}}]'
          curl --fail --silent -H "Authorization: Bearer $TEST_TOKEN" -H 'Content-Type: application/json' --data "$alert_payload" http://127.0.0.1:18080/v1/telemetry >/dev/null
          test "$(psql -h localhost -U postgres -d syspilot -tAc 'SELECT count(*) FROM syspilot_control.reasoning_jobs')" = 1
          test "$(psql -h localhost -U postgres -d syspilot -tAc "SELECT count(*) FROM syspilot_control.notification_deliveries WHERE alert_instance_id='alert-instance'")" = 1
          delivery=$(PGPASSWORD=notifier-test psql -h localhost -U syspilot_notifier -d syspilot -tAc "SELECT delivery_id FROM syspilot_control.lease_notification_delivery() LIMIT 1")
          test -n "$delivery"
          PGPASSWORD=notifier-test psql -h localhost -U syspilot_notifier -d syspilot --set ON_ERROR_STOP=1 \
            --command "SELECT syspilot_control.complete_notification_delivery('00000000-0000-0000-0000-000000000001',$delivery)" >/dev/null
          test "$(psql -h localhost -U postgres -d syspilot -tAc "SELECT count(*) FROM syspilot_control.notification_deliveries WHERE status='delivered'")" = 1
          leased=$(PGPASSWORD=reasoner-test psql -h localhost -U syspilot_reasoner -d syspilot -tAc "SELECT job_id FROM syspilot_control.lease_reasoning_job() LIMIT 1")
          test -n "$leased"
          PGPASSWORD=reasoner-test psql -h localhost -U syspilot_reasoner -d syspilot --set ON_ERROR_STOP=1 \
            --command "SELECT syspilot_control.complete_reasoning_job('00000000-0000-0000-0000-000000000001',$leased,'{\"summary\":\"ci reasoning\"}'::jsonb)" >/dev/null
          test "$(psql -h localhost -U postgres -d syspilot -tAc "SELECT count(*) FROM syspilot_control.reasoning_results WHERE result->>'summary'='ci reasoning'")" = 1
