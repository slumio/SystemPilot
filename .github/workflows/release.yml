name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive binary and checksum
        run: |
          mkdir -p dist
          install -m 0755 target/${{ matrix.target }}/release/syspilot dist/syspilot
          tar -C dist -czf dist/syspilot-${{ matrix.target }}.tar.gz syspilot
          rm dist/syspilot
          cd dist
          sha256sum syspilot-${{ matrix.target }}.tar.gz > syspilot-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install pinned nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
      - name: Build distribution packages
        env:
          SYSPILOT_PACKAGE_ARCH: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'amd64' || 'arm64' }}
          SYSPILOT_PACKAGE_BINARY: target/${{ matrix.target }}/release/syspilot
          SYSPILOT_PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          package_version="${SYSPILOT_PACKAGE_VERSION#v}"
          export SYSPILOT_PACKAGE_VERSION="$package_version"
          deploy/packages/build.sh deb "dist/syspilot-${package_version}-${SYSPILOT_PACKAGE_ARCH}.deb"
          rpm_arch="$SYSPILOT_PACKAGE_ARCH"
          [ "$rpm_arch" != amd64 ] || rpm_arch=x86_64
          [ "$rpm_arch" != arm64 ] || rpm_arch=aarch64
          SYSPILOT_PACKAGE_ARCH="$rpm_arch" deploy/packages/build.sh rpm "dist/syspilot-${package_version}-${rpm_arch}.rpm"
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: target/${{ matrix.target }}/release/syspilot
          artifact-name: syspilot-${{ matrix.target }}.spdx.json
          output-file: dist/syspilot-${{ matrix.target }}.spdx.json
          upload-artifact: false
      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/syspilot-${{ matrix.target }}.tar.gz
      - uses: sigstore/cosign-installer@v3.9.2
      - name: Sign release archive
        run: cosign sign-blob --yes --bundle dist/syspilot-${{ matrix.target }}.tar.gz.sigstore.json dist/syspilot-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: syspilot-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: syspilot-*
          path: dist
          merge-multiple: true
      - name: Verify archives and create release manifest
        run: |
          cd dist
          sha256sum --check syspilot-*.tar.gz.sha256
          sha256sum syspilot-*.tar.gz syspilot-*.spdx.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: syspilot-release-assets
          path: dist/
          if-no-files-found: error

  publish:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: syspilot-release-assets
          path: dist
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/*
          else
            gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes
          fi
