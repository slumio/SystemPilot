<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SysPilot CausalTrace</title>
<style>
:root{{--bg:#0b0f17;--panel:#111827;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--cyan:#38bdf8;--red:#ef4444}}
*{{box-sizing:border-box}} body{{font-family:system-ui,sans-serif;margin:0;background:var(--bg);color:var(--text)}}
header{{padding:1rem 1.5rem;background:#0f172a;border-bottom:1px solid var(--border)}} h1{{margin:0;color:var(--cyan)}}
.badge{{margin-top:.4rem;color:#fca5a5}} main{{padding:1.5rem;display:grid;grid-template-columns:minmax(0,2fr) minmax(18rem,1fr);gap:1rem}}
#graph,.inspector{{background:var(--panel);border:1px solid var(--border);border-radius:.6rem;padding:1rem}}
.node{{display:block;width:100%;text-align:left;margin:.5rem 0;padding:.75rem;border:1px solid var(--cyan);border-radius:.45rem;background:#082f49;color:var(--text);cursor:pointer}}
.node.resource{{background:#1e293b;border-color:#64748b}} .node.anomalous{{background:#450a0a;border-color:var(--red)}}
.edge{{color:var(--muted);padding-left:1rem;font:0.85rem monospace}} dt{{color:var(--muted);margin-top:.7rem}} dd{{margin-left:0;overflow-wrap:anywhere}}
@media(max-width:760px){{main{{grid-template-columns:1fr}}}}
</style>
</head>
<body>
<header><h1>SysPilot CausalTrace</h1><div class="badge" id="symptom"></div></header>
<main><section id="graph" aria-label="Causal graph"></section><aside class="inspector"><h2>Node Inspector</h2><dl id="details"><dd>Select a node to inspect.</dd></dl></aside></main>
<script>
// Self-contained offline renderer; no Cytoscape or CDN network dependency.
const elements = {elements_json};
const symptom = {symptom_json};
document.getElementById('symptom').textContent = 'Symptom: ' + symptom;
const graph = document.getElementById('graph');
const details = document.getElementById('details');
const nodes = elements.filter(element => element.data && !element.data.source);
const edges = elements.filter(element => element.data && element.data.source);
function addField(label,value){{const dt=document.createElement('dt');dt.textContent=label;const dd=document.createElement('dd');dd.textContent=String(value ?? 'unavailable');details.append(dt,dd)}}
for(const element of nodes){{
  const data=element.data; const button=document.createElement('button');
  button.className='node '+data.type+(data.is_anomalous?' anomalous':'');
  button.textContent=data.name+' ['+data.id+']';
  button.addEventListener('click',()=>{{details.replaceChildren();for(const [key,value] of Object.entries(data)) addField(key,value)}});
  graph.appendChild(button);
  for(const edge of edges.filter(edge=>edge.data.source===data.id)){{const line=document.createElement('div');line.className='edge';line.textContent='↳ '+edge.data.type+' → '+edge.data.target;graph.appendChild(line)}}
}}
if(nodes.length===0) graph.textContent='No causal path was available.';
</script>
</body>
</html>
